  <div class="header-left">

        <g fill="#ffffff">
          <text x="10" y="85" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="70" letter-spacing="-2">MEGA</text>
          <text x="180" y="135" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="70" letter-spacing="-2">GIRO</text>
          <text x="185" y="162" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="0.5">Distribuidor Autorizado</text>
          <path d="M 330 60 C 310 30, 200 40, 100 100 C 60 124, 50 145, 65 152 C 75 157, 120 145, 170 120" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
      </svg>
    </a>
  </div>

  <!-- Menu Principal com links para as páginas dedicadas -->
  <nav class="main-menu" id="mainMenu">
    <a href="Meta_Vol.html" class="menu-item" id="menu-vol">
      <i class="fa-solid fa-chart-column"></i> Meta de Volume

    <a href="Meta_Cob.html" class="menu-item" id="menu-cob">

  </nav>

  <div class="user-info">
    <span class="user-name"><i class="fa-regular fa-user"></i> <span id="headerFirstName">Carregando...</span></span>
    <button onclick="handleLogout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
  </div>
</header>

<script>
  (function() {
    function aplicarPermissoesHeader() {
      const usuarioData = localStorage.getItem('usuarioLogado');
      if (!usuarioData) return false;

      try {
        const parsed = JSON.parse(usuarioData);
        const usuario = parsed.usuario || parsed;

        // 1. Exibe o primeiro nome do usuário
        if (usuario && usuario.nome) {
          const primeiroNome = usuario.nome.trim().split(' ')[0];
          const span = document.getElementById('headerFirstName');
          if (span) span.innerText = primeiroNome;
        }

        // 2. Se for Gerente ou Supervisor, oculta os menus de Importações e Cadastro globalmente
        const funcao = usuario?.funcao || '';
        if (funcao === 'Gerente' || funcao === 'Supervisor') {
          const menuImp = document.getElementById('menu-imp');
          const menuCad = document.getElementById('menu-cad');
          if (menuImp) menuImp.style.display = 'none';
          if (menuCad) menuCad.style.display = 'none';
        }
        return true;
      } catch (e) {
        console.error('Erro ao processar permissões do usuário:', e);
        return false;
      }
    }

    // Varredura inteligente para garantir que o script pegue o elemento logo após o fetch
    if (!aplicarPermissoesHeader()) {
      const intervalo = setInterval(() => {
        if (aplicarPermissoesHeader() || clearInterval(intervalo));
      }, 30);
    }
  })();

  function handleLogout() {
    localStorage.removeItem('usuarioLogado');
    window.location.href = 'index.html';
  }
</script>
