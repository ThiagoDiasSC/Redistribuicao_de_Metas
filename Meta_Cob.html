<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA GIRO - Meta de Cobertura</title>
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23006633%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%23ffffff%22 text-anchor=%22middle%22 font-family=%22Arial%22>MG</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Layout/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 0 0 20px 0; }
    .dashboard-container { padding: 0 20px 20px 20px; max-width: 1400px; margin: 0 auto; }

    .subtitle-card {
      background: #006633;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .subtitle-card h1 { font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 13px; color: #d1e7dd; margin-top: 4px; }

    .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .empty-state { text-align: center; padding: 40px 20px; color: #666; }
    .empty-state i { font-size: 48px; color: #006633; margin-bottom: 12px; }
  </style>
</head>
<body>

  <!-- PROTEÇÃO DE SESSÃO -->
  <script>
    if (!localStorage.getItem('usuarioLogado')) {
      window.location.href = 'index.html';
    }
  </script>

  <!-- Cabeçalho -->
  <div id="header-container"></div>

  <div class="dashboard-container">
    <div class="subtitle-card">
      <h1>MEGA GIRO - Distribuição de Metas de Cobertura</h1>
      <div class="subtitle">Acompanhamento e distribuição de metas de cobertura por cliente e vendedor.</div>
    </div>

    <div class="card">
      <div class="empty-state">
        <i class="fa-solid fa-bullseye"></i>
        <h3>Módulo Meta de Cobertura</h3>
        <p>A estrutura deste módulo está pronta. Em breve as tabelas e rotas de processamento estarão disponíveis.</p>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <div id="footer-container"></div>

  <script>
    async function carregarLayout() {
    try {
      const resHeader = await fetch('Layout/Cabecalho/header.html');
      if (resHeader.ok) {
        document.getElementById('header-container').innerHTML = await resHeader.text();
        
        // --- INSERE O PRIMEIRO NOME ASSIM QUE O HEADER É CARREGADO ---
        const usuarioData = localStorage.getItem('usuarioLogado');
        if (usuarioData) {
          try {
            const parsed = JSON.parse(usuarioData);
            const nomeCompleto = parsed.usuario?.nome || parsed.nome || '';
            if (nomeCompleto) {
              const primeiroNome = nomeCompleto.trim().split(' ')[0];
              const span = document.getElementById('headerFirstName');
              if (span) span.innerText = primeiroNome;
            }
          } catch (e) {
            console.error('Erro ao ler usuário:', e);
          }
        }
      }

      const resFooter = await fetch('Layout/Rodape/footer.html');
      if (resFooter.ok) document.getElementById('footer-container').innerHTML = await resFooter.text();
    } catch (err) {
      console.error('Erro ao carregar layout:', err);
    }
  }

  function handleLogout() {
    localStorage.removeItem('usuarioLogado');
    window.location.href = 'index.html';
  }

    window.onload = carregarLayout;
  </script>
</body>
</html>
