<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MEGA GIRO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Layout/style.css">
</head>
<body class="auth-page">

  <main class="card-container">
    <!-- Banner Verde do Cabeçalho -->
    <div class="banner-header">
      <svg class="banner-logo" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
        <g fill="#ffffff">
          <text x="10" y="85" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="70" letter-spacing="-2">MEGA</text>
          <text x="180" y="135" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="70" letter-spacing="-2">GIRO</text>
          <text x="185" y="162" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="0.5">Distribuidor Autorizado</text>
          <path d="M 330 60 C 310 30, 200 40, 100 100 C 60 124, 50 145, 65 152 C 75 157, 120 145, 170 120" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- Conteúdo Interno do Cartão -->
    <div class="card-content">
      <h2 class="title">Acesso ao Sistema</h2>
      <p class="instructions">Informe o seu e-mail e senha corporativos para aceder.</p>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Usuário</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="form-input" placeholder="E-mail" required autocomplete="username">
            <i class="fa-regular fa-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="Digite sua senha" required autocomplete="current-password">
            <i class="fa-solid fa-lock input-icon"></i>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Exibir/Ocultar senha">
              <i class="fa-regular fa-eye-slash" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="forgot-password">
          <a href="Trocar_Senha/TrocaSenha.html">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

        <div id="messageBox" class="message-box"></div>
      </form>
    </div>
  </main>

  <footer class="footer-text">
    &copy; 2026 TMK. Todos os direitos reservados.
  </footer>

  <script>
    const API_BASE_URL = window.location.port === '5500' ? 'http://localhost:3000' : '';

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      }
    }

    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageBox = document.getElementById('messageBox');

      messageBox.className = 'message-box';
      messageBox.innerText = '';

      try {
        const response = await fetch(`${API_BASE_URL}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          messageBox.className = 'message-box success';
          messageBox.innerText = data.message;

          localStorage.setItem('usuarioLogado', JSON.stringify({
            email: username,
            autenticado: true
          }));

          setTimeout(() => {
            window.location.href = 'home.html';
          }, 1500);
        } else {
          messageBox.className = 'message-box error';
          messageBox.innerText = data.message || 'E-mail ou senha incorretos.';
        }
      } catch (error) {
        console.error('Erro de conexão:', error);
        messageBox.className = 'message-box error';
        messageBox.innerText = 'Não foi possível conectar ao servidor. Verifique se o backend (node server.js) está rodando.';
      }
    }
  </script>
</body>
</html>
